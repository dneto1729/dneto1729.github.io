name: Scrape Talk Locations

on:
  push:
    paths:
      - '_talks/**'
      - 'talkmap.py'
      - '.github/workflows/scrape_talks.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install python-frontmatter getorg geopy

    - name: Build the talk map
      run: python talkmap.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add talkmap
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
